spring:
  application:
    name: milebag-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

milebag:
  jwt:
    # Segredo e expiracao sempre vindos de variavel de ambiente (nunca hardcoded) -
    # ver core/config/security/JwtProperties. Valores de dev ficam em application-dev.yml.
    secret: ${MILEBAG_JWT_SECRET}
    expiration-minutes: ${MILEBAG_JWT_EXPIRATION_MINUTES:60}
  armazenamento:
    diretorio-base: ${MILEBAG_STORAGE_DIR:./storage}
  ocr:
    # Dados de treino do Tesseract (pacote de idioma) - ver research.md da
    # feature 001, secao 4.
    tessdata-path: ${MILEBAG_TESSDATA_PATH:./tessdata}
