spring:
  application:
    name: milebag-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Conta das migracoes SEPARADA da conta da aplicacao: as tabelas tem
    # FORCE ROW LEVEL SECURITY, entao a conta da aplicacao (sem BYPASSRLS,
    # de proposito - e o que faz o isolamento por tenant valer) nao consegue
    # rodar migracoes de seed nem manter as tabelas. Sem MILEBAG_FLYWAY_USER
    # cai na conta da aplicacao (comportamento anterior) - suficiente para
    # migracoes sem dados, mas as de seed (ex.: V13) exigem a conta propria.
    user: ${MILEBAG_FLYWAY_USER:${MILEBAG_DB_USER:milebag_app}}
    password: ${MILEBAG_FLYWAY_PASSWORD:${MILEBAG_DB_PASSWORD:milebag_app}}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

milebag:
  # Fuso usado nos textos enviados ao passageiro (ex.: janela de reagendamento,
  # HU29) - a API pode rodar em UTC no container.
  fuso-horario: ${MILEBAG_FUSO_HORARIO:America/Sao_Paulo}
  cors:
    # Origens do front-end autorizadas a chamar a API (CORS) - sempre
    # explicito por ambiente, nunca hardcoded. Valor de dev fica em
    # application-dev.yml.
    allowed-origin-patterns: ${MILEBAG_CORS_ALLOWED_ORIGINS}
  jwt:
    # Segredo e expiracao sempre vindos de variavel de ambiente (nunca hardcoded) -
    # ver core/config/security/JwtProperties. Valores de dev ficam em application-dev.yml.
    secret: ${MILEBAG_JWT_SECRET}
    expiration-minutes: ${MILEBAG_JWT_EXPIRATION_MINUTES:60}
  armazenamento:
    diretorio-base: ${MILEBAG_STORAGE_DIR:./storage}
  ocr:
    # Dados de treino do Tesseract (pacote de idioma) - ver research.md da
    # feature 001, secao 4.
    tessdata-path: ${MILEBAG_TESSDATA_PATH:./tessdata}
  convite:
    # Prazo de validade e URL base do link de ativacao do convite de
    # administrador (HU15) - ver ConviteProperties. urlBase aponta para o
    # front-end (mile_bag_app), nao para esta API.
    prazo-validade-horas: ${MILEBAG_CONVITE_PRAZO_VALIDADE_HORAS:72}
    url-base: ${MILEBAG_CONVITE_URL_BASE}
  smtp:
    # Envio do e-mail de convite (HU15) - mesmo padrao de habilitado/
    # desabilitado do IMAP abaixo, ate a infraestrutura de e-mail
    # self-hosted (HU18) estar provisionada.
    habilitado: ${MILEBAG_SMTP_HABILITADO:false}
    host: ${MILEBAG_SMTP_HOST:}
    port: ${MILEBAG_SMTP_PORT:587}
    usuario: ${MILEBAG_SMTP_USUARIO:}
    senha: ${MILEBAG_SMTP_SENHA:}
    remetente: ${MILEBAG_SMTP_REMETENTE:}
  imap:
    # Caixa de entrada compartilhada de recebimento automatico do BDO (HU02,
    # RF21) - servidor self-hosted de HU18. Desabilitado por padrao ate essa
    # infraestrutura estar provisionada (ver research.md desta HU).
    habilitado: ${MILEBAG_IMAP_HABILITADO:false}
    host: ${MILEBAG_IMAP_HOST:}
    port: ${MILEBAG_IMAP_PORT:993}
    usuario: ${MILEBAG_IMAP_USUARIO:}
    senha: ${MILEBAG_IMAP_SENHA:}
    intervalo-consulta-ms: ${MILEBAG_IMAP_INTERVALO_MS:60000}
  push:
    # Web Push do aviso de BDO novo (HU32) - par VAPID por ambiente, gerado pelo
    # implantar.sh (mile_bag_infra). Vazio = push desligado; o aviso continua
    # valendo com o app aberto.
    chave-publica: ${MILEBAG_PUSH_CHAVE_PUBLICA:}
    chave-privada: ${MILEBAG_PUSH_CHAVE_PRIVADA:}
    assunto: ${MILEBAG_PUSH_ASSUNTO:mailto:noreply@milebag.local}
  telegram:
    # Bot unico da plataforma (HU18, FR-010) - criado via @BotFather, sem
    # processo de aprovacao. Desabilitado por padrao ate o token existir.
    habilitado: ${MILEBAG_TELEGRAM_HABILITADO:false}
    bot-token: ${MILEBAG_TELEGRAM_BOT_TOKEN:}
    bot-username: ${MILEBAG_TELEGRAM_BOT_USERNAME:}
    # Validado no cabecalho X-Telegram-Bot-Api-Secret-Token do webhook de
    # entrada - configurado junto ao setWebhook, nao e segredo de usuario.
    webhook-secret: ${MILEBAG_TELEGRAM_WEBHOOK_SECRET:}
    # So muda em teste (servidor local no lugar da Bot API real).
    api-base-url: ${MILEBAG_TELEGRAM_API_URL:https://api.telegram.org}
  mensageria:
    # Caixa de e-mail de recebimento da conversa com o passageiro (HU18) -
    # distinta da caixa de BDO (milebag.imap acima). Desabilitada por
    # padrao ate a infraestrutura self-hosted estar provisionada.
    imap-habilitado: ${MILEBAG_MENSAGERIA_IMAP_HABILITADO:false}
    imap-host: ${MILEBAG_MENSAGERIA_IMAP_HOST:}
    imap-port: ${MILEBAG_MENSAGERIA_IMAP_PORT:993}
    imap-usuario: ${MILEBAG_MENSAGERIA_IMAP_USUARIO:}
    imap-senha: ${MILEBAG_MENSAGERIA_IMAP_SENHA:}
    imap-intervalo-consulta-ms: ${MILEBAG_MENSAGERIA_IMAP_INTERVALO_MS:60000}
    # Base do Reply-To por entrega: entrega-{entregaId}@<dominio-email>.
    dominio-email: ${MILEBAG_MENSAGERIA_DOMINIO_EMAIL:mensagens.milebag.local}
  rotas:
    # Motor de rotas/geocodificacao open source (HU03) - ver research.md da
    # feature 001, secao 5.
    valhalla:
      base-url: ${MILEBAG_VALHALLA_URL:http://localhost:8002}
    nominatim:
      base-url: ${MILEBAG_NOMINATIM_URL:https://nominatim.openstreetmap.org}
      # Identifica a aplicacao ao Nominatim publico - trocar para um contato
      # real antes de qualquer uso fora de desenvolvimento (politica de uso
      # do servico).
      user-agent: ${MILEBAG_NOMINATIM_USER_AGENT:milebag-api/0.1 (dev@milebag.local)}
